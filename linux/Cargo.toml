[package]
name = "sam-orchestrator"
version = "0.1.0"
edition = "2024"
description = "SuperAwesomeMagicalOrchestrator's agent for the Linux desktop: one sign-in for every app, and your devices working together"
license = "GPL-3.0-only"
homepage = "https://github.com/603Madison/SAM-DeviceOrchestrator"
repository = "https://github.com/603Madison/SAM-DeviceOrchestrator"
readme = "README.md"
publish = false

[[bin]]
name = "sam-orchestrator"
path = "src/main.rs"

[dependencies]
aes-gcm = "0.10"
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
hkdf = "0.12"
p256 = { version = "0.13", default-features = false, features = ["ecdh", "arithmetic", "std"] }
rand_core = { version = "0.6", features = ["getrandom"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-native-certs = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "net", "io-util", "signal", "fs"] }
tokio-tungstenite = { version = "0.26", default-features = false, features = ["connect", "handshake", "__rustls-tls"] }
url = "2"
zbus = { version = "5", default-features = false, features = ["tokio"] }

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
