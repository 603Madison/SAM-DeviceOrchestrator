name: Release

# Publishes a GitHub release with notes from release-notes/<version>.md, then adds to it the
# Linux agent's packages (.deb and .rpm) and the signed Android APK, and publishes the server's
# container image to ghcr.io/<owner>/superawesomemagicalorchestrator. Start it from the Actions
# tab ("Run workflow") with the version, or push a v* tag. The release's tag is created on the
# built commit if it doesn't exist yet.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, e.g. v0.1.0 (must match versionName in android/build.gradle.kts)
        required: true
      commit:
        description: Commit to build (defaults to the selected branch's latest commit)
        required: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.commit || github.sha }}
          # The token isn't left in .git/config for the tests and builds to find.
          persist-credentials: false

      - name: Check version
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::A version looks like v1.2.3"
            exit 1
          fi
          VERSION_NAME=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' android/build.gradle.kts)
          if [ "v$VERSION_NAME" != "$TAG" ]; then
            echo "::error::$TAG doesn't match versionName $VERSION_NAME in android/build.gradle.kts"
            exit 1
          fi
          LINUX_VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' linux/Cargo.toml | head -1)
          if [ "v$LINUX_VERSION" != "$TAG" ]; then
            echo "::error::$TAG doesn't match the Linux agent's version $LINUX_VERSION in linux/Cargo.toml"
            exit 1
          fi
          echo "COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Tests
        run: |
          (cd web && npm ci --no-audit --no-fund && npm run build)
          (cd web && npm test)
          ./gradlew --no-daemon :shared:test :server:test :android:testDebugUnitTest

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git show "HEAD:release-notes/$TAG.md" > notes.md 2>/dev/null || echo "SuperAwesomeMagicalOrchestrator $TAG" > notes.md
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$COMMIT" --title "SuperAwesomeMagicalOrchestrator $TAG" --notes-file notes.md
          fi

  # The Linux agent (linux/, Rust; it links only glibc): a .deb for Ubuntu 24.04 and later and
  # an .rpm for Fedora (SuperAwesomeMagicalLinux's image build takes the newest release's).
  # Built on Ubuntu 24.04, the oldest it supports, so it runs on everything newer.
  linux:
    needs: release
    runs-on: ubuntu-24.04
    env:
      TAG: ${{ inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.commit || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: linux
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb,cargo-generate-rpm

      - name: Test and build the packages
        working-directory: linux
        run: |
          cargo test --release --locked
          cargo build --release --locked
          cargo deb --no-build
          cargo generate-rpm
          mkdir -p ../out
          cp target/debian/*.deb "../out/SuperAwesomeMagicalOrchestrator-Linux-$TAG-amd64.deb"
          cp target/generate-rpm/*.rpm "../out/SuperAwesomeMagicalOrchestrator-Linux-$TAG-x86_64.rpm"
          (cd ../out && sha256sum SuperAwesomeMagicalOrchestrator-Linux-* > SHA256SUMS && cat SHA256SUMS)

      - name: Add them to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" out/SuperAwesomeMagicalOrchestrator-Linux-* out/SHA256SUMS --clobber

  # The signed APK. Every release must be signed with the same key, or installed copies can't be
  # updated (see CLAUDE.md). It lives in repository secrets, never in git, and is on disk only for
  # the signed build, then deleted. Without the secrets this job fails and says so; the rest of
  # the release doesn't wait for it.
  android:
    needs: release
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.commit || github.sha }}
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Add RELEASE_KEYSTORE_BASE64 and RELEASE_KEYSTORE_PASSWORD under Settings > Secrets and variables > Actions > Repository secrets (see CLAUDE.md for making the key), then run this workflow again for the same version"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | tr -d ' \n\r' | base64 -d > "$RUNNER_TEMP/release.jks"
          if ! keytool -list -keystore "$RUNNER_TEMP/release.jks" -storepass "$KEYSTORE_PASSWORD" >/dev/null 2>&1; then
            echo "::error::The keystore couldn't be opened: check that RELEASE_KEYSTORE_BASE64 was pasted completely and the password matches"
            exit 1
          fi
          echo "RELEASE_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build the signed APK
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
        run: |
          ./gradlew --no-daemon :android:assembleRelease
          cp android/build/outputs/apk/release/android-release.apk "SuperAwesomeMagicalOrchestrator-$TAG.apk"
          sha256sum SuperAwesomeMagicalOrchestrator-*.apk
          # The certificate's fingerprint: what the family's apps pin (kits/android/OrchestratorLink.kt).
          keytool -list -v -keystore "$RUNNER_TEMP/release.jks" -storepass "$RELEASE_KEYSTORE_PASSWORD" | grep "SHA256:" | head -1

      - name: Forget the signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Add it to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" "SuperAwesomeMagicalOrchestrator-$TAG.apk" --clobber

  # The server and web app, for amd64 and arm64 (a Raspberry Pi), at
  # ghcr.io/<owner>/superawesomemagicalorchestrator:<version> and :latest, whatever the repository is called.
  image:
    # Only once the release (its version check and tests) has passed: installs that update
    # themselves pull this image.
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      TAG: ${{ inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.commit || github.sha }}
          persist-credentials: false

      - name: Image name and tags
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::A version looks like v1.2.3"
            exit 1
          fi
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/superawesomemagicalorchestrator"
          VERSION="${TAG#v}"
          {
            echo "TAGS<<EOF"
            echo "$IMAGE:$VERSION"
            echo "$IMAGE:${VERSION%.*}"
            echo "$IMAGE:latest"
            echo "EOF"
          } >> "$GITHUB_ENV"

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: Containerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.TAGS }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ env.TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
