name: Checks

# Every push and pull request: the server's tests, the web app's type check, tests and build, and
# the Android app's tests, lint and debug APK (kept as a build artifact for a week).
on:
  push:
  pull_request:

# Reading the code is all the checks need.
permissions:
  contents: read

jobs:
  server-and-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Web app
        working-directory: web
        run: npm ci --no-audit --no-fund && npm run build && npm test
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - name: Server tests
        env:
          SAMO_SERVER_ONLY: "1"
        run: ./gradlew --no-daemon :server:test :server:installDist

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - name: Tests, lint and a debug APK
        run: ./gradlew --no-daemon :android:testDebugUnitTest :android:lintDebug :android:assembleDebug
      - uses: actions/upload-artifact@v7
        with:
          name: SuperAwesomeMagicalOrchestrator-debug-apk
          path: android/build/outputs/apk/debug/*.apk
          retention-days: 7
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: android-screenshots
          path: android/build/outputs/screenshots/
          retention-days: 7
          if-no-files-found: ignore
